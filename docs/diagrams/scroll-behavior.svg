<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="690" viewBox="0 0 1200 690" role="img" aria-labelledby="title desc">
<title id="title">One hand, two musical behaviors</title><desc id="desc">Illustrative timeline: gesture mode speeds up notes and holds a harmony on stopping; groove mode keeps its beat and plays its lead only during scrolling.</desc>
<style>text{font-family:Arial,Helvetica,sans-serif;fill:#263c35}.small{font-size:17px;fill:#54675f}.label{font-size:20px;font-weight:700}.title{font-size:30px;font-weight:700}.note{font-size:24px;font-weight:700}.mono{font-family:Menlo,Consolas,monospace;font-size:18px}</style>
<rect width="1200" height="690" rx="22" fill="#f4f1e8"/>
<text x="40" y="52" class="title" >One hand. Two musical behaviors.</text>
<text x="40" y="84" class="small" >Illustrative timing, not a recording. Fast movement never queues skipped notes.</text>
<rect x="300" y="116" width="212" height="444" fill="#ede9df"/>
<text x="312" y="147" class="small" >SLOW SCROLL</text>
<line x1="300" y1="160" x2="300" y2="560" stroke="#d3d9cc" stroke-width="1" stroke-dasharray="4 5"/>
<rect x="512" y="116" width="212" height="444" fill="#ede9df"/>
<text x="524" y="147" class="small" >READING</text>
<line x1="512" y1="160" x2="512" y2="560" stroke="#d3d9cc" stroke-width="1" stroke-dasharray="4 5"/>
<rect x="724" y="116" width="212" height="444" fill="#ede9df"/>
<text x="736" y="147" class="small" >FAST SCROLL</text>
<line x1="724" y1="160" x2="724" y2="560" stroke="#d3d9cc" stroke-width="1" stroke-dasharray="4 5"/>
<rect x="936" y="116" width="212" height="444" fill="#e0e8dc"/>
<text x="948" y="147" class="small" >STOP SCROLLING</text>
<line x1="936" y1="160" x2="936" y2="560" stroke="#d3d9cc" stroke-width="1" stroke-dasharray="4 5"/>
<text x="40" y="206" class="label" >GESTURE MODE</text>
<text x="40" y="234" class="small" >Readings 01–17</text>
<text x="40" y="269" class="small" >Hand → phrasing</text>
