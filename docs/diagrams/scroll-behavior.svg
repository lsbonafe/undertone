<text x="1010" y="511" class="small" >Lead rings out</text>
<text x="304" y="552" class="small" >Steady backing; lead notes follow your hand, then ring out.</text>
<rect x="40" y="597" width="340" height="48" rx="10" fill="#e3e6dc"/>
<text x="55" y="627" class="small" >Tiny jitter is ignored</text>
<rect x="415" y="597" width="340" height="48" rx="10" fill="#e3e6dc"/>
