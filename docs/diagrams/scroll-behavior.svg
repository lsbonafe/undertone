<text x="967" y="275" class="small" >Hold the harmony</text>
<text x="304" y="318" class="small" >Wider gaps → closer gaps → bounded fast phrasing → held harmony</text>
<text x="40" y="387" class="label" >GROOVE MODE</text>
<text x="40" y="415" class="small" >Readings 18–20</text>
<text x="40" y="452" class="small" >Clock → backing</text>
<text x="40" y="511" class="small" >Hand → lead</text>
